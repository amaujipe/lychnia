# ═══════════════════════════════════════════════════════════════════════════
#  EJEMPLO REAL — callouts.toml de la prédica 2026-08-30 «Gracia que produce
#  excelencia» (Génesis 8). Convertido 1:1 del gen_callouts_2026-08-30.py original;
#  gen_callouts.py genera con él exactamente el mismo callouts.ass (verificado).
#  Reglas: docs/18. Texto RVR1960 verificado en Bible Gateway, nunca de la transcripción.
#  Anclas: frases del SRT normalizadas (minúsculas, sin tildes); `after` = segundo
#  mínimo para desambiguar; `interpolar` = posición dentro de la cue (find_in).
# ═══════════════════════════════════════════════════════════════════════════
version = "RVR1960"

[versiculos]                        # texto canónico, una vez por referencia
"GÉNESIS 8:1" = "Y se acordó Dios de Noé, y de todos los animales, y de todas las bestias que estaban con él en el arca; e hizo pasar Dios un viento sobre la tierra, y disminuyeron las aguas."
"GÉNESIS 8:2" = "Y se cerraron las fuentes del abismo y las cataratas de los cielos; y la lluvia de los cielos fue detenida."
"GÉNESIS 8:3" = "Y las aguas decrecían gradualmente de sobre la tierra; y se retiraron las aguas al cabo de ciento cincuenta días."
"GÉNESIS 8:4" = "Y reposó el arca en el mes séptimo, a los diecisiete días del mes, sobre los montes de Ararat."
"GÉNESIS 8:5" = "Y las aguas fueron decreciendo hasta el mes décimo; en el décimo, al primero del mes, se descubrieron las cimas de los montes."
"GÉNESIS 8:6" = "Sucedió que al cabo de cuarenta días abrió Noé la ventana del arca que había hecho,"
"GÉNESIS 8:7" = "y envió un cuervo, el cual salió, y estuvo yendo y volviendo hasta que las aguas se secaron sobre la tierra."
"GÉNESIS 8:8" = "Envió también de sí una paloma, para ver si las aguas se habían retirado de sobre la faz de la tierra."
"GÉNESIS 8:9" = "Y no halló la paloma donde sentar la planta de su pie, y volvió a él al arca, porque las aguas estaban aún sobre la faz de toda la tierra. Entonces él extendió su mano, y tomándola, la hizo entrar consigo en el arca."
"GÉNESIS 8:10" = "Esperó aún otros siete días, y volvió a enviar la paloma fuera del arca."
"GÉNESIS 8:11" = "Y la paloma volvió a él a la hora de la tarde; y he aquí que traía una hoja de olivo en el pico; y entendió Noé que las aguas se habían retirado de sobre la tierra."
"GÉNESIS 8:12" = "Y esperó aún otros siete días, y envió la paloma, la cual no volvió ya más a él."
"GÉNESIS 8:13" = "Y sucedió que en el año seiscientos uno de Noé, en el mes primero, el día primero del mes, las aguas se secaron sobre la tierra; y quitó Noé la cubierta del arca, y miró, y he aquí que la faz de la tierra estaba seca."
"GÉNESIS 8:14" = "Y en el mes segundo, a los veintisiete días del mes, se secó la tierra."
"GÉNESIS 8:15" = "Entonces habló Dios a Noé, diciendo:"
"GÉNESIS 8:16" = "Sal del arca tú, y tu mujer, y tus hijos, y las mujeres de tus hijos contigo."
"GÉNESIS 8:17" = "Todos los animales que están contigo de toda carne, de aves y de bestias y de todo reptil que se arrastra sobre la tierra, sacarás contigo; y vayan por la tierra, y fructifiquen y multiplíquense sobre la tierra."
"GÉNESIS 8:18" = "Entonces salió Noé, y sus hijos, su mujer, y las mujeres de sus hijos con él."
"GÉNESIS 8:19" = "Todos los animales, y todo reptil y toda ave, todo lo que se mueve sobre la tierra según sus especies, salieron del arca."
"GÉNESIS 8:20" = "Y edificó Noé un altar a Jehová, y tomó de todo animal limpio y de toda ave limpia, y ofreció holocausto en el altar."
"GÉNESIS 8:21" = "Y percibió Jehová olor grato; y dijo Jehová en su corazón: No volveré más a maldecir la tierra por causa del hombre; porque el intento del corazón del hombre es malo desde su juventud; ni volveré más a destruir todo ser viviente, como he hecho."
"GÉNESIS 8:22" = "Mientras la tierra permanezca, no cesarán la sementera y la siega, el frío y el calor, el verano y el invierno, y el día y la noche."
"ISAÍAS 49:14" = "Pero Sion dijo: Me dejó Jehová, y el Señor se olvidó de mí."
"ISAÍAS 49:15" = "¿Se olvidará la mujer de lo que dio a luz, para dejar de compadecerse del hijo de su vientre? Aunque olvide ella, yo nunca me olvidaré de ti."
"ISAÍAS 49:16" = "He aquí que en las palmas de las manos te tengo esculpida; delante de mí están siempre tus muros."
"HECHOS 3:6" = "Mas Pedro dijo: No tengo plata ni oro, pero lo que tengo te doy; en el nombre de Jesucristo de Nazaret, levántate y anda."
"MATEO 25:35-36" = "Porque tuve hambre, y me disteis de comer; tuve sed, y me disteis de beber; fui forastero, y me recogisteis; estuve desnudo, y me cubristeis; enfermo, y me visitasteis; en la cárcel, y vinisteis a mí."

