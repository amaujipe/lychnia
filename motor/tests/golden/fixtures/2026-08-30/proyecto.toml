# ═══════════════════════════════════════════════════════════════════════════
#  EJEMPLO REAL — proyecto.toml de la prédica 2026-08-30 «Gracia que produce
#  excelencia» (Génesis 8). Con esta config, `make plan` reproduce plano por plano
#  los 87 planos aprobados en su Gate A (verificado 2026-09-03). Sirve de referencia
#  para llenar el de una prédica nueva; la plantilla vacía está en
#  _plantilla-proyecto/proyecto.toml.
# ═══════════════════════════════════════════════════════════════════════════

[meta]                              # se escribe UNA vez; miniatura, blog y metadata lo leen
fecha = "2026-08-30"   # AAAA-MM-DD (make init lo toma del nombre de la carpeta)
slug = "gracia-que-produce-excelencia"   # kebab-case (idem)
titulo   = "Gracia que produce excelencia"                       # título de la prédica (blog/web)
pasaje   = "Génesis 8"                       # p. ej. "Génesis 8"
pastor   = "Américo Ulabarry"                       # nombre completo, bien escrito (lección «Tamayo», 2026-08-23)
autor_id = "seniorPastor"                       # id en authors.ts de la web: seniorPastor | associatePastor | guestSpeaker

[fuentes]                           # rutas explícitas, relativas a esta carpeta
maestro = "ENTREGA/audio/2026-08-30 09-41-53.mkv"   # ENTREGA/audio/<archivo>  (el audio bueno; su video es el programa de OBS)
cam_a = "ENTREGA/cam-panoramica/2026-08-30_09-41-53_Panoramica.mkv"   # ENTREGA/cam-panoramica/<archivo>
cam_b = "ENTREGA/cam-pastor/2026-08-30_09-41-53_Pastor.mkv"   # ENTREGA/cam-pastor/<archivo>  (vacío si no hubo cámara del pastor)

[sync]                              # t_camara = t_maestro + off   (ver 3-guion/sincronia.md)
off_a = -0.333
off_b = -0.600
audio_delay_ms = 0                  # retrasar el audio N ms (20 en la prédica del 2026-07-19); ≥ 0

[corte]                             # decisión del Gate A, en segundos de MAESTRO
entrada = 557.5                       # dónde arranca el video final
salida  = 5242.5                       # dónde termina

[video]                             # filtros por cámara de la Fase 1 (opcional; estos son los default)
# vf_a = "scale=1920:1080:flags=bicubic,setsar=1"
# vf_b = "scale=1920:1080:flags=bicubic,unsharp=5:5:0.3,setsar=1"
# Cam B 720p → "scale=1920:1080:flags=lanczos,unsharp=5:5:0.4,setsar=1"  (2026-07-05)
# Cam B invertida → anteponer "hflip,vflip,"                              (2026-07-12)

[audio]                             # las tres perillas de la cadena de voz (la cadena vive en cfg.py)
mezcla = "dual-mono"                # dual-mono | izquierdo | derecho  (medir L−R antes de decidir)
lufs   = -15                        # objetivo de loudnorm (−16 limpio > −14 distorsionado, docs/14 §C)

[gate_b]                            # clip de muestra: un tramo con cambio de cámara + callouts
inicio   = 3021                      # segundo de maestro
duracion = 65

# ── shorts 9:16 (docs/08). Entradas/salidas imantadas a silencios reales; el FIN
#    se elige para que remate en la frase fuerte. Mirar el último cuadro de cada uno.
# [[shorts]]
# id     = "s1-logico-o-biblico"
# ini    = 3013.29
# fin    = 3055.30
# clave  = "bíblica"                # palabra en dorado
# titulo = "Noé podía bajarse del arca. No se bajó."

# Texto de una cue forzado a mano, por posición ("-1" = última, "0" = primera):
# [shorts_overrides."s3-dios-en-la-lluvia"]
# "-1" = "A Dios en medio de la lluvia aprende a ver a Dios en medio del desastre"

# ── plan de cámaras: fases que alimentan a planear_camaras.py (Gate A). Cada fase
#    lleva la cámara del plano largo, su duración y la del plano de descanso; el
#    planificador imanta cada corte al silencio más largo cercano y escribe
#    3-guion/plan_camaras.json (que es lo que se aprueba).
[plan]
cierre_a = 26.0                     # últimos segundos en panorámica
# [[plan.fases]]
# t_ini = 557.5
# t_fin = 570.0
# cam = "A"                         # cámara del plano largo
# dur_larga = 12.5
# dur_descanso = 0.0                # 0 = sin descansos (un solo plano)
# nota = "establecimiento: la sala mientras anuncia el pasaje"

[[shorts]]
id = "s1-logico-o-biblico"
ini = 3013.29
fin = 3055.3
clave = "bíblica"
titulo = "Noé podía bajarse del arca. No se bajó."

